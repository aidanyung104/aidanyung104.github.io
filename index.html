<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aidan Yung — Streaming, Broadcast Systems and Software Engineer">
  <title>Aidan Yung</title>

  <!--
  ╔══════════════════════════════════════════════════════════╗
  ║  GITHUB PAGES SETUP                                      ║
  ║  ─────────────────────────────────────────────────────   ║
  ║  your-repo/                                              ║
  ║  ├── index.html                                          ║
  ║  ├── styles.css                                          ║
  ║  ├── scripts.js                                          ║
  ║  └── images/                                             ║
  ║      ├── about/        ← about gallery photos            ║
  ║      └── work/                                           ║
  ║          ├── disney/   ← disney photos                   ║
  ║          ├── smt/                                        ║
  ║          ├── durham-bulls/                               ║
  ║          └── savannah-bananas/                           ║
  ║                                                          ║
  ║  Settings → Pages → Source: main branch → / (root)      ║
  ╚══════════════════════════════════════════════════════════╝
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=VT323&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ═══════════════════════════════════════════════
       HOME
  ═══════════════════════════════════════════════ -->
  <section id="home" class="page active">
    <div class="home-inner">

      <h1 class="site-name">Aidan Yung</h1>

      <div class="tv-wrapper">
        <div class="tv-frame">
          <div class="tv-screen" id="tv-screen"
               role="navigation"
               aria-label="Site navigation — left half for About, right half for Work"
               tabindex="0">

            <!-- Top 75%: classic 7-bar SMPTE pattern -->
            <div class="tv-top" id="tv-top" aria-hidden="true">
              <div class="tv-bar" style="background:#C0C0C0" data-color="gray"></div>
              <div class="tv-bar" style="background:#C0C000" data-color="yellow"></div>
              <div class="tv-bar" style="background:#00C0C0" data-color="cyan"></div>
              <div class="tv-bar" style="background:#00C000" data-color="green"></div>
              <div class="tv-bar" style="background:#C000C0" data-color="magenta"></div>
              <div class="tv-bar" style="background:#C00000" data-color="red"></div>
              <div class="tv-bar" style="background:#0000C0" data-color="blue"></div>
            </div>

            <!-- Bottom 25%: PLUGE reference row -->
            <div class="tv-bottom" aria-hidden="true">
              <div class="tv-pluge" style="background:#00214C"></div>
              <div class="tv-pluge" style="background:#000000"></div>
              <div class="tv-pluge" style="background:#21008A"></div>
              <div class="tv-pluge" style="background:#000000"></div>
              <div class="tv-pluge" style="background:#FFFFFF"></div>
              <div class="tv-pluge" style="background:#1F4CB5"></div>
              <div class="tv-pluge" style="background:#000000"></div>
            </div>

            <!-- Hover navigation labels -->
            <span class="tv-hint tv-hint-left"  aria-hidden="true">ABOUT</span>
            <span class="tv-hint tv-hint-right" aria-hidden="true">WORK</span>

            <!-- CRT overlay effects -->
            <div class="tv-scanlines" aria-hidden="true"></div>
            <div class="tv-vignette"  aria-hidden="true"></div>
            <div class="tv-glare"     aria-hidden="true"></div>
          </div>
        </div>
      </div>

      <p class="site-subtitle">Streaming, Broadcast Systems &amp; Software Engineer</p>

      <!-- Screen-reader nav instructions -->
      <p class="sr-only">
        Use left/right arrow keys on the TV to navigate. Left: About. Right: Work.
      </p>

    </div>
  </section>

  <!-- ═══════════════════════════════════════════════
       ABOUT
  ═══════════════════════════════════════════════ -->
  <section id="about" class="page">
    <nav class="top-nav">
      <button class="back-btn" data-target="home" aria-label="Back to home">← HOME</button>
    </nav>
    <div class="page-container">
      <h2 class="page-title">About Me</h2>

      <div class="about-layout">
        <!-- Gallery: photos injected by scripts.js -->
        <div class="photo-grid" id="about-gallery"
             role="list" aria-label="About photo gallery"></div>

        <div class="about-text-col">
          <!-- Bio text: injected by scripts.js -->
          <div id="about-bio"></div>

          <div class="connect-block">
            <p class="connect-label">Let's connect!</p>
            <!-- Social links: injected by scripts.js -->
            <div class="social-row" id="social-links" role="list"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══════════════════════════════════════════════
       WORK
  ═══════════════════════════════════════════════ -->
  <section id="work" class="page">
    <nav class="top-nav">
      <button class="back-btn" data-target="home" aria-label="Back to home">← HOME</button>
    </nav>
    <div class="page-container">
      <h2 class="page-title">Work</h2>

      <div class="work-layout">
        <div class="work-left-col">
          <!-- Employer buttons: injected by scripts.js -->
          <div class="work-btn-group" id="work-buttons"
               role="list" aria-label="Select an employer"></div>

          <div class="work-arrow" aria-hidden="true">↓</div>

          <!-- Job description: injected by scripts.js, live region for a11y -->
          <div class="work-desc" id="work-description" aria-live="polite"></div>
        </div>

        <!-- Photo gallery: injected by scripts.js -->
        <div class="photo-grid" id="work-gallery"
             role="list" aria-label="Work photo gallery"></div>
      </div>
    </div>
  </section>

  <!-- ═══════════════════════════════════════════════
       LIGHTBOX (shared)
  ═══════════════════════════════════════════════ -->
  <div id="lightbox" class="lightbox"
       role="dialog" aria-modal="true" aria-label="Enlarged photo">
    <button class="lb-close" id="lb-close" aria-label="Close lightbox">&times;</button>
    <img id="lb-img" src="" alt="">
  </div>

  <!-- ═══════════════════════════════════════════════
       PAGE TRANSITION OVERLAY
  ═══════════════════════════════════════════════ -->
  <div id="t-overlay" class="t-overlay" aria-hidden="true"></div>

  <script src="scripts.js"></script>
</body>
</html>
